id: seo-blog
name: SEO Blog Pipeline
description: "Generate an SEO-optimized blog post with keyword targeting"
version: "2.0"

trigger:
  type: command
  pattern: "seo.*blog|write.*blog.*for|rank.*for"

inputs:
  - name: topic
    type: string
    description: "Blog topic or title"
    required: true
  - name: keywords
    type: array
    description: "Target SEO keywords"
    default: []
  - name: brand_profile
    type: reference
    description: "Brand profile for tone and voice"
    default: active_brand
  - name: word_count
    type: integer
    description: "Target word count"
    default: 1800
  - name: style
    type: string
    description: "Writing style"
    default: informational

steps:
  - id: write
    skill: seo-blog
    modelTier: complex
    action: >
      Generate a comprehensive SEO-optimized blog post on the given topic.
      Follow brand voice, target keywords, and structure for readability.
    inputs:
      topic: "${inputs.topic}"
      keywords: "${inputs.keywords}"
      word_count: "${inputs.word_count}"
      style: "${inputs.style}"
      brand_profile: "${inputs.brand_profile}"
    retry:
      max: 2
      backoff: exponential
    output: article

  - id: generate_hero_image
    skill: image-generator
    action: >
      Create a hero/featured image for the blog post that visually
      represents the topic and attracts clicks.
    inputs:
      prompt: >
        Create a professional blog hero image for an article titled:
        "$article.meta_title". Topic: ${inputs.topic}.
        Style: modern, clean, editorial photography style. The image should
        be visually compelling, relevant to the topic, and work as a
        featured image / social sharing thumbnail. No text in the image.
        Wide format, high quality.
      count: 1
      size: "1792x1024"
      quality: "hd"
      style: "natural"
    retry:
      max: 2
      backoff: exponential
    output: hero_image

  - id: generate_schema
    skill: schema-generator
    action: >
      Generate JSON-LD structured data for the blog post including
      Article schema, and optionally FAQ and HowTo schemas if the
      content contains Q&A or step-by-step sections.
    inputs:
      content: "$article"
      schema_types: ["article", "faq", "howto"]
      author: "${inputs.brand_profile}"
    output: seo_schemas

outputs:
  - format: markdown
    includes:
      - article_body
      - meta_title
      - meta_description
      - heading_structure
      - hero_image
      - json_ld_schemas
