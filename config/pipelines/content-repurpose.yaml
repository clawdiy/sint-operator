id: content-repurpose
name: Content Repurposing Pipeline
description: "Upload one long-form asset → multi-platform content suite"
version: "2.0"

trigger:
  type: asset_upload
  pattern: "repurpose|shred|turn.*into.*posts"
  accept:
    - text/plain
    - text/markdown
    - application/pdf
    - video/mp4
    - audio/mpeg

inputs:
  - name: source_asset
    type: file
    description: "Video URL, mp4, article URL, or long-form text"
    required: true
  - name: brand_profile
    type: reference
    description: "Brand profile to use"
    default: active_brand
  - name: platforms
    type: array
    default: [tiktok, instagram_reels, linkedin, blog]

steps:
  - id: ingest
    skill: asset-ingester
    action: >
      If video: extract audio → Whisper transcription → timestamped transcript.
      If article URL: scrape + clean text.
      If text: pass through.
    inputs:
      source_asset: "${inputs.source_asset}"
    output: raw_transcript

  - id: analyze
    skill: content-analyzer
    modelTier: routine
    action: >
      Identify key themes, quotable moments, data points.
      Score each segment for platform suitability.
      Extract 10 best "hook" moments for short-form.
    inputs:
      raw_transcript: "$raw_transcript.raw_transcript"
      segments: "$raw_transcript.segments"
      target_platforms: "${inputs.platforms}"
    output: content_map

  - id: generate
    skill: content-repurpose
    modelTier: complex
    action: >
      Using the content map, generate platform-specific deliverables.
      Each piece is complete and ready to post.
    inputs:
      text: "$raw_transcript.raw_transcript"
      target_platforms: "${inputs.platforms}"
      content_map: "$content_map"
    retry:
      max: 2
      backoff: exponential
    output: deliverables

  - id: clip_video
    skill: video-clipper
    action: >
      Extract short-form video clips (15-60s) optimized for TikTok and
      Instagram Reels from the source asset. Use the content map to
      identify the best hook moments. Apply 9:16 crop, burned-in captions,
      and brand watermark.
    inputs:
      source_asset: "${inputs.source_asset}"
      content_map: "$content_map"
      platforms: ["tiktok", "instagram_reels"]
    condition: "$raw_transcript.mediaType == 'video'"
    retry:
      max: 1
      backoff: exponential
    output: video_clips

  - id: generate_images
    skill: image-generator
    action: >
      Generate social media images for each platform post. Create
      visually compelling graphics that match the content and brand style.
    inputs:
      prompt: >
        Create a professional social media graphic for: $deliverables.summary.
        Brand style: ${inputs.brand_profile}. Modern, clean, engaging design.
      count: 4
      size: "1024x1024"
    retry:
      max: 2
      backoff: exponential
    output: platform_images

  - id: approval_gate
    skill: notifier
    action: >
      Send generated content package for human approval before publishing.
      Include all deliverables, video clips, and generated images for review.
    inputs:
      deliverables: "$deliverables"
      video_clips: "$video_clips"
      platform_images: "$platform_images"
      action: "approval_request"
    condition: "env.APPROVAL_REQUIRED"
    output: approval_status

outputs:
  - platform: twitter
    format: thread
    constraints:
      maxLength: 280
  - platform: linkedin
    format: text
    constraints:
      maxLength: 3000
  - platform: instagram
    format: caption
    constraints:
      maxLength: 2200
  - platform: instagram_reels
    format: script
    constraints:
      maxDuration: 90
  - platform: tiktok
    format: script
    constraints:
      maxDuration: 60
      maxLength: 300
  - platform: blog
    format: article
    constraints:
      maxLength: 50000
  - platform: all
    format: images
    source: platform_images
  - platform: tiktok,instagram_reels
    format: video_clips
    source: video_clips
